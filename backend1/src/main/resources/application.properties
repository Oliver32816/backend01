spring.application.name=backend1

#url de la conexión con la base de datos
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/backend1-bd
spring.datasource.username=postgres
spring.datasource.password=123

#Configuraciones de spring data JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

#Configuraciones de desarrollador
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true